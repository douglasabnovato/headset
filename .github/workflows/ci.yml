# CI do Headset Store: a cada push e pull request na main e nas developer/**, instala,
# audita as dependências, checa os tipos, roda os testes do front e da API e faz o build.
name: CI

on:
  push:
    branches: [main, 'developer/**']
  pull_request:
    branches: [main, 'developer/**']

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Bloqueia: alerta alto ou crítico em dependência de produção (#26)
      - run: npm audit --omit=dev --audit-level=high
      # Só avisa: o audit completo, inclusive desenvolvimento, aparece no log e no resumo do run
      - name: npm audit completo (aviso)
        run: npm audit || echo "::warning title=npm audit::há alertas nas dependências; ver o log deste passo"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
# fim de ci.yml

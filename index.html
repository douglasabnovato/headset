<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Headset Store: headphones over-ear, in-ear e gamer com frete grátis a partir de R$ 299." />
    <meta name="theme-color" content="#b31fd6" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      /* Fonte só depois do load: pedir o CSS dela antes atrasava a primeira pintura no perfil móvel */
      window.addEventListener("load", function () {
        var font = document.createElement("link");
        font.rel = "stylesheet";
        font.media = "print";
        font.onload = function () {
          font.media = "all";
        };
        font.href = "https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap";
        document.head.appendChild(font);
      });
    </script>
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" /></noscript>
    <script>
      try { var t = JSON.parse(localStorage.getItem("headset:tema")); if (t) document.documentElement.setAttribute("data-bs-theme", t); } catch (e) {}
    </script>
    <script>
      /* Só na vitrine sem filtros: pede a imagem do destaque (o LCP) antes do JavaScript e da API (#15). */
      if (location.pathname === "/" && !location.search) {
        var destaque = document.createElement("link");
        destaque.rel = "preload";
        destaque.as = "image";
        destaque.href = "/produtos/kitty-quartz.png";
        destaque.setAttribute("fetchpriority", "high");
        document.head.appendChild(destaque);
      }
    </script>
    <title>Headset Store · headphones, fones gamer e in-ear</title>
  </head>
  <body>
    <noscript>Ative o JavaScript para usar a Headset Store.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
